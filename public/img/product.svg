    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A5247"/><stop offset=".5" stop-color="#3A6E5F"/><stop offset="1" stop-color="#244A40"/></linearGradient>
